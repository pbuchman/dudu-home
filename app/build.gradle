plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.piotrbuchman.dudugate'
    compileSdk 36

    defaultConfig {
        applicationId 'pl.piotrbuchman.dudugate'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.2.0-local'
        testInstrumentationRunner 'pl.piotrbuchman.dudugate.SafetyChecks'
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }
}

name: Build and privacy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: python3 scripts/check-public-tree.py --all-history
      - run: python3 scripts/test-private-tools.py
      - run: python3 scripts/test-navigation.py
      - run: python3 scripts/test-public-tree.py
      - run: python3 scripts/test-fresh-installer.py
      - run: python3 -m pip install osmium==4.3.1
      - run: bash scripts/check-trip.sh
      - run: python3 scripts/test-radio-update.py
      - run: bash scripts/check-routebook.sh
      - run: bash scripts/check-detector.sh
      - run: python3 scripts/check-progress.py
      - run: ./gradlew assembleDebug assembleDebugAndroidTest lintDebug

  routebook:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: routebook_synthetic
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: routebook
    env:
      ROUTEBOOK_TEST_DB_URL: postgresql://postgres@127.0.0.1:55439/routebook_synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: routebook/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:contract
      - run: python3 deploy/test-templates.py
      - run: node --test deploy/plan.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser --workspace ui
        env:
          ROUTEBOOK_FIXTURES_PATH: ${{ github.workspace }}/routebook/contract/fixtures.json

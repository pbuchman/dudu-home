name: Build and privacy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: python3 scripts/check-public-tree.py --all-history
      - run: python3 scripts/test-private-tools.py
      - run: python3 scripts/test-navigation.py
      - run: python3 scripts/test-public-tree.py
      - run: python3 scripts/test-fresh-installer.py
      - run: python3 -m pip install osmium==4.3.1
      - run: bash scripts/check-trip.sh
      - run: python3 scripts/test-radio-update.py
      - run: python3 scripts/test-update-cleanup.py
      - run: python3 scripts/test-automation-diagnostics.py
      - run: bash scripts/check-diagnostics.sh
      - run: bash scripts/check-routebook.sh
      - run: bash scripts/check-detector.sh
      - run: python3 scripts/check-progress.py
      - run: ./gradlew assembleDebug assembleDebugAndroidTest lintDebug

  trip-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator
      - name: Build debug and instrumentation APKs
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm
          test -w /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Run compact overlay instrumentation on Android 13
        run: |
          # This hosted job builds Java only. Leave space for the system image and writable AVD.
          if (( $(df -Pk "$RUNNER_TEMP" | awk 'END { print $4 }') < 16777216 )); then
            sudo rm -rf -- "$ANDROID_HOME/ndk"
          fi
          export ANDROID_AVD_HOME="$RUNNER_TEMP/trip-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          image='system-images;android-33;google_apis;x86_64'
          sdkmanager "$image"
          printf 'no\n' | avdmanager create avd --name trip-overlay --device pixel_2 --package "$image"
          sed -i '/^disk.dataPartition.size=/d' "$ANDROID_AVD_HOME/trip-overlay.avd/config.ini"
          echo 'disk.dataPartition.size=2048M' >> "$ANDROID_AVD_HOME/trip-overlay.avd/config.ini"
          df -h "$ANDROID_AVD_HOME"
          adb start-server
          boot_log="$RUNNER_TEMP/trip-emulator.log"
          "$ANDROID_HOME/emulator/emulator" -avd trip-overlay -port 5554 -accel on \
            -no-window -no-audio -no-snapshot -no-boot-anim -camera-back none -camera-front none \
            -memory 2048 -cores 2 -gpu software >"$boot_log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          for attempt in {1..150}; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              tail -80 "$boot_log" >&2
              echo 'The Android emulator exited before boot.' >&2
              exit 1
            fi
            if [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then
              bash scripts/run-trip-overlay-check.sh emulator-5554
              exit
            fi
            sleep 2
          done
          tail -80 "$boot_log" >&2
          echo 'The Android emulator did not boot within five minutes.' >&2
          exit 1

  routebook:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: routebook_synthetic
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: routebook
    env:
      ROUTEBOOK_TEST_DB_URL: postgresql://postgres@127.0.0.1:55439/routebook_synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: routebook/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node --test tests/parking/*.test.mjs
      - run: npm run check:contract
      - run: python3 deploy/test-templates.py
      - run: node --test deploy/plan.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Install local analytics proxy
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
      - name: Analytics acceptance with PostGIS, nginx and Chromium
        run: node --test tests/analytics/acceptance.test.mjs
        env:
          ROUTEBOOK_ANALYTICS_TEST_DB: ${{ env.ROUTEBOOK_TEST_DB_URL }}
          ROUTEBOOK_ANALYTICS_BROWSER: '1'
          ROUTEBOOK_ANALYTICS_EVIDENCE: ${{ runner.temp }}/routebook-analytics-qa
      - run: npm run test:browser --workspace ui
        env:
          ROUTEBOOK_FIXTURES_PATH: ${{ github.workspace }}/routebook/contract/fixtures.json

name: Build and privacy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: python3 scripts/check-public-tree.py --all-history
      - run: python3 scripts/test-private-tools.py
      - run: bash scripts/check-detector.sh
      - run: ./gradlew assembleDebug assembleDebugAndroidTest lintDebug
